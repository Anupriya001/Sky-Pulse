<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPulse | Real-Time Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #0f172a, #020617);
            min-height: 100vh;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .storm-glow {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            border: 1px solid rgba(239, 68, 68, 0.8) !important;
        }
    </style>
</head>
<body class="flex items-center justify-center p-6">

    <div class="max-w-6xl w-full grid grid-cols-12 gap-6">
        
        <header class="col-span-12 glass p-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="text-blue-400 text-3xl">☁️⚡</div>
                <h1 class="text-2xl font-bold tracking-wider">SkyPulse</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-xs text-gray-400">Location</p>
                    <p class="font-semibold">Workckot <span class="text-green-400 text-xs ml-1">● Live</span></p>
                </div>
                <div class="w-10 h-10 rounded-full border-2 border-green-500 flex items-center justify-center">
                    <span class="text-green-500">↓</span>
                </div>
            </div>
        </header>

        <aside class="col-span-12 md:col-span-3 glass p-6 space-y-4">
            <h2 class="text-sm uppercase tracking-widest text-gray-400 mb-4 text-center">Watching Cities</h2>
            
            <div class="glass bg-white/5 p-3 flex justify-between items-center cursor-pointer hover:bg-white/10 transition">
                <span>London</span> <span class="text-gray-400">°C</span>
            </div>
            <div class="glass bg-white/5 p-3 flex justify-between items-center cursor-pointer hover:bg-white/10 transition">
                <span>Tokyo</span> <span class="text-gray
